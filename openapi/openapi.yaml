openapi: 3.1.0
info:
  title: PS Parts API
  version: 0.0.0
tags: []
paths:
  /api/auth/me:
    get:
      operationId: currentUser
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          description: Access is unauthorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
      security:
        - ApiKeyAuth: []
  /api/auth/signin:
    post:
      operationId: signin
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          description: The server could not understand the request due to invalid syntax.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          description: Access is unauthorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Credentials'
  /api/auth/signout:
    post:
      operationId: signout
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                required:
                  - success
                unevaluatedProperties:
                  not: {}
        '400':
          description: The server could not understand the request due to invalid syntax.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /api/auth/signup:
    post:
      operationId: signup
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          description: The server could not understand the request due to invalid syntax.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '409':
          description: The request conflicts with the current state of the server.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Credentials'
  /api/categories:
    get:
      operationId: listCategories
      description: Список категорий, отсортированный по id.
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Category'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /api/orders:
    post:
      operationId: createOrder
      parameters: []
      responses:
        '201':
          description: The request has succeeded and a new resource has been created as a result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '400':
          description: The server could not understand the request due to invalid syntax.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          description: Access is unauthorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '409':
          description: The request conflicts with the current state of the server.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderRejected'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrder'
      security:
        - ApiKeyAuth: []
    get:
      operationId: listOrders
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Order'
        '401':
          description: Access is unauthorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
      security:
        - ApiKeyAuth: []
  /api/orders/{id}:
    get:
      operationId: getOrder
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int32
            minimum: 1
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '400':
          description: The server could not understand the request due to invalid syntax.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          description: Access is unauthorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: The server cannot find the requested resource.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
      security:
        - ApiKeyAuth: []
  /api/products:
    get:
      operationId: listProducts
      description: Каталог товаров с названиями категорий, отсортированный по id.
      parameters:
        - name: category
          in: query
          required: false
          description: Необязательный фильтр по slug категории.
          schema:
            type: string
            pattern: ^[a-z0-9]+(?:-[a-z0-9]+)*$
            minLength: 1
            maxLength: 100
          explode: false
        - name: priceMin
          in: query
          required: false
          description: Минимальная цена в целых рублях, включительно.
          schema:
            type: integer
            format: int32
            minimum: 0
            maximum: 21474836
          explode: false
        - name: priceMax
          in: query
          required: false
          description: Максимальная цена в целых рублях, включительно.
          schema:
            type: integer
            format: int32
            minimum: 0
            maximum: 21474836
          explode: false
        - name: available
          in: query
          required: false
          schema:
            type: boolean
          explode: false
        - name: search
          in: query
          required: false
          schema:
            type: string
            minLength: 1
            maxLength: 100
          explode: false
        - name: page
          in: query
          required: false
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 100000
            default: 1
          explode: false
        - name: pageSize
          in: query
          required: false
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 48
            default: 12
          explode: false
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductPage'
        '400':
          description: The server could not understand the request due to invalid syntax.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: The server cannot find the requested resource.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /api/products/{id}:
    get:
      operationId: getProduct
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int32
            minimum: 1
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '400':
          description: The server could not understand the request due to invalid syntax.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: The server cannot find the requested resource.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /api/promotions:
    get:
      operationId: listPromotions
      description: Промо-блоки в порядке показа. Недоступные товары исключены; пустой список допустим.
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Promotion'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /health-check:
    get:
      operationId: healthCheck
      description: Проверка доступности сервера.
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
components:
  schemas:
    ApiError:
      type: object
      required:
        - statusCode
        - error
        - message
      properties:
        statusCode:
          type: integer
          format: int32
          minimum: 400
          maximum: 599
        error:
          type: string
        message:
          type: string
      description: Единый JSON-формат ошибок API. statusCode совпадает с HTTP-статусом.
      examples:
        - statusCode: 400
          error: Bad Request
          message: Некорректный запрос
    Category:
      type: object
      required:
        - id
        - slug
        - name
      properties:
        id:
          type: integer
          format: int32
        slug:
          type: string
        name:
          type: string
      unevaluatedProperties:
        not: {}
    CreateOrder:
      type: object
      required:
        - items
        - receiving
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/OrderInputItem'
          minItems: 1
          maxItems: 100
        receiving:
          $ref: '#/components/schemas/Receiving'
      unevaluatedProperties:
        not: {}
    Credentials:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          minLength: 3
          maxLength: 254
          pattern: ^[^\s@]+@[^\s@]+\.[^\s@]+$
        password:
          type: string
          minLength: 8
          maxLength: 128
      unevaluatedProperties:
        not: {}
    Delivery:
      type: object
      required:
        - name
        - phone
        - method
        - address
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
          pattern: \S
        phone:
          type: string
          minLength: 7
          maxLength: 25
          pattern: ^(?=(?:\D*\d){7,15}\D*$)\+?[0-9 ()-]{7,25}$
        method:
          type: string
          enum:
            - delivery
        address:
          type: string
          minLength: 1
          maxLength: 500
          pattern: \S
      unevaluatedProperties:
        not: {}
    Health:
      type: object
      required:
        - health
      properties:
        health:
          type: string
          enum:
            - check
      unevaluatedProperties:
        not: {}
    Money:
      type: object
      required:
        - amount
        - currency
      properties:
        amount:
          type: integer
          minimum: 0
          maximum: 9007199254740991
        currency:
          type: string
          enum:
            - RUB
      unevaluatedProperties:
        not: {}
      description: 'Денежная сумма: amount — целое число копеек, currency — RUB.'
      examples:
        - amount: 1999000
          currency: RUB
    Order:
      type: object
      required:
        - id
        - status
        - createdAt
        - receiving
        - items
        - total
      properties:
        id:
          type: integer
          format: int32
        status:
          type: string
          enum:
            - paid
        createdAt:
          type: string
          format: date-time
        receiving:
          $ref: '#/components/schemas/Receiving'
        items:
          type: array
          items:
            $ref: '#/components/schemas/OrderItem'
        total:
          $ref: '#/components/schemas/Money'
      unevaluatedProperties:
        not: {}
    OrderInputItem:
      type: object
      required:
        - id
        - quantity
      properties:
        id:
          type: integer
          format: int32
          minimum: 1
        quantity:
          type: integer
          format: int32
          minimum: 1
          maximum: 999
      unevaluatedProperties:
        not: {}
    OrderItem:
      type: object
      required:
        - productId
        - name
        - quantity
        - price
        - total
      properties:
        productId:
          type: integer
          format: int32
        name:
          type: string
        quantity:
          type: integer
          format: int32
          minimum: 1
        price:
          $ref: '#/components/schemas/Money'
        total:
          $ref: '#/components/schemas/Money'
      unevaluatedProperties:
        not: {}
    OrderRejected:
      type: object
      required:
        - products
      properties:
        products:
          type: array
          items:
            $ref: '#/components/schemas/ProblemProduct'
      unevaluatedProperties:
        not: {}
      allOf:
        - $ref: '#/components/schemas/ApiError'
    Pickup:
      type: object
      required:
        - name
        - phone
        - method
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
          pattern: \S
        phone:
          type: string
          minLength: 7
          maxLength: 25
          pattern: ^(?=(?:\D*\d){7,15}\D*$)\+?[0-9 ()-]{7,25}$
        method:
          type: string
          enum:
            - pickup
      unevaluatedProperties:
        not: {}
    ProblemProduct:
      type: object
      required:
        - id
        - reason
      properties:
        id:
          type: integer
          format: int32
        reason:
          type: string
          enum:
            - not_found
            - unavailable
      unevaluatedProperties:
        not: {}
    Product:
      type: object
      required:
        - id
        - sku
        - name
        - description
        - price
        - category_slug
        - category_name
        - image_url
        - available
      properties:
        id:
          type: integer
          format: int32
        sku:
          type: string
        name:
          type: string
        description:
          type: string
        price:
          $ref: '#/components/schemas/Money'
        category_slug:
          type: string
        category_name:
          type: string
        image_url:
          anyOf:
            - type: string
            - type: 'null'
        available:
          type: boolean
      unevaluatedProperties:
        not: {}
    ProductPage:
      type: object
      required:
        - items
        - total
        - page
        - pageSize
        - totalPages
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Product'
        total:
          type: integer
          format: int32
          minimum: 0
        page:
          type: integer
          format: int32
          minimum: 1
        pageSize:
          type: integer
          format: int32
          minimum: 1
        totalPages:
          type: integer
          format: int32
          minimum: 0
      unevaluatedProperties:
        not: {}
    Promotion:
      type: object
      required:
        - id
        - title
        - text
        - product
      properties:
        id:
          type: integer
          format: int32
        title:
          type: string
          minLength: 1
        text:
          type: string
          minLength: 1
        product:
          $ref: '#/components/schemas/Product'
      unevaluatedProperties:
        not: {}
      description: Промо-блок главной. Товар уникален в подборке и доступен для покупки.
    Receiving:
      anyOf:
        - $ref: '#/components/schemas/Delivery'
        - $ref: '#/components/schemas/Pickup'
    Recipient:
      type: object
      required:
        - name
        - phone
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
          pattern: \S
        phone:
          type: string
          minLength: 7
          maxLength: 25
          pattern: ^(?=(?:\D*\d){7,15}\D*$)\+?[0-9 ()-]{7,25}$
      unevaluatedProperties:
        not: {}
    User:
      type: object
      required:
        - id
        - email
      properties:
        id:
          type: integer
          format: int32
        email:
          type: string
      unevaluatedProperties:
        not: {}
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: cookie
      name: psparts_session
