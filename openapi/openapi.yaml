openapi: 3.1.0
info:
  title: PS Parts API
  version: 0.0.0
tags: []
paths:
  /api/categories:
    get:
      operationId: listCategories
      description: Список категорий, отсортированный по id.
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Category'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /api/products:
    get:
      operationId: listProducts
      description: Каталог товаров с названиями категорий, отсортированный по id.
      parameters:
        - name: category
          in: query
          required: false
          description: Необязательный фильтр по slug категории.
          schema:
            type: string
            pattern: ^[a-z0-9]+(?:-[a-z0-9]+)*$
            minLength: 1
            maxLength: 100
          explode: false
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Product'
        '400':
          description: The server could not understand the request due to invalid syntax.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: The server cannot find the requested resource.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /health-check:
    get:
      operationId: healthCheck
      description: Проверка доступности сервера.
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
components:
  schemas:
    ApiError:
      type: object
      required:
        - statusCode
        - error
        - message
      properties:
        statusCode:
          type: integer
          format: int32
          minimum: 400
          maximum: 599
        error:
          type: string
        message:
          type: string
      description: Единый JSON-формат ошибок API. statusCode совпадает с HTTP-статусом.
      examples:
        - statusCode: 400
          error: Bad Request
          message: Некорректный запрос
    Category:
      type: object
      required:
        - id
        - slug
        - name
      properties:
        id:
          type: integer
          format: int32
        slug:
          type: string
        name:
          type: string
    Health:
      type: object
      required:
        - health
      properties:
        health:
          type: string
          enum:
            - check
    Money:
      type: object
      required:
        - amount
        - currency
      properties:
        amount:
          type: integer
          format: int32
          minimum: 0
        currency:
          type: string
          enum:
            - RUB
      description: 'Денежная сумма: amount — целое число копеек, currency — RUB.'
      examples:
        - amount: 1999000
          currency: RUB
    Product:
      type: object
      required:
        - id
        - sku
        - name
        - description
        - price
        - category_slug
        - category_name
      properties:
        id:
          type: integer
          format: int32
        sku:
          type: string
        name:
          type: string
        description:
          type: string
        price:
          $ref: '#/components/schemas/Money'
        category_slug:
          type: string
        category_name:
          type: string
