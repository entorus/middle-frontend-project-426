services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: psparts
      POSTGRES_USER: psparts
      POSTGRES_PASSWORD: local_password
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U psparts -d psparts"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    environment:
      NODE_ENV: production
      PORT: "3000"
      DATABASE_URL: postgresql://psparts:local_password@db:5432/psparts
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data: