name: Quality
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/api/package-lock.json
            apps/front/package-lock.json
      - run: npm ci && npm --prefix apps/api ci && npm --prefix apps/front ci
      - run: npm run lint && npm run format:check && npm run build
      - run: docker compose up --build -d --wait --wait-timeout 180
      - run: npm run test:smoke
      - run: docker compose exec -T app node dist/db/prepare.js && npm run test:smoke
      - if: always()
        run: docker compose logs --tail=100
      - if: always()
        run: docker compose down
